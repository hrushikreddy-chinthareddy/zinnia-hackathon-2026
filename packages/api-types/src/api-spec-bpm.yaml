openapi: 3.0.0
info:
  title: Zinnia Business Process Management Service
  description: Enterprise business process management API for transactions. Handles validation and posting of transactions to Zinnia's Systems of Record.
  version: 0.1.0
  contact: {}
servers:
  - url: https://qa.api.zinnia.io
    description: QA Environment
  - url: https://dev.api.zinnia.io
    description: DEV Environment
tags:
  - name: Financial Transactions
    description: Financial Transactions
  - name: Non Financial Transactions
    description: Non Financial Transactions
  - name: Policy - Transactions
    description: All Apis related to policy operations
paths:
  /bpm/v1/policies/{planCode}/{policyNumber}/onetimepremium/validation:
    post:
      tags:
        - Financial Transactions
      summary: Validation OneTime Premium Transaction
      operationId: validationOneTimePremiumTransaction
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
        - in: path
          name: policyNumber
          schema:
            type: string
          required: true
          description: Policy Number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimePremiumRequest'
        required: true
      responses:
        '200':
          description: OneTime Premium Success Response.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponse'
        '400':
          description: OneTime Premium Failure Response.yaml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: Internal server error. Please check server logs for more details.
      security:
        - Auth0:
            - read:policy
  /bpm/v1/policies/{planCode}/{policyNumber}/onetimepremium:
    post:
      tags:
        - Financial Transactions
      summary: Submit OneTime Premium Transaction
      operationId: submitOneTimePremiumTransaction
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
        - in: path
          name: policyNumber
          schema:
            type: string
          required: true
          description: Policy Number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimePremiumRequest'
        required: true
      responses:
        '202':
          description: Submit Transaction Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAcceptedResponse'
        '500':
          description: Internal server error. Please check server logs for more details.
      security:
        - Auth0:
            - write:policy
  /bpm/v1/policies/{planCode}/{policyNumber}/onetimepremium/eligibilitycheck:
    post:
      tags:
        - Financial Transactions
      summary: Eligibility Check OneTime Premium Transaction
      operationId: eligibilitycheckOneTimePremiumTransaction
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
        - in: path
          name: policyNumber
          schema:
            type: string
          required: true
          description: Policy Number
      responses:
        '200':
          description: OneTime Premium Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponse'
        '400':
          description: OneTime Premium Failure Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'
        '500':
          description: Unexpected error occured, please check server logs
      security:
        - Auth0:
            - read:policy
  /bpm/v1/policies/{planCode}/{policyNumber}/systematicprograms/{arrangementId}/validation:
    post:
      tags:
        - Financial Transactions
      summary: Validate Systematic Program Update Transaction
      operationId: systematicProgramUpdateValidation
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
        - name: policyNumber
          in: path
          required: true
          schema:
            type: string
        - name: arrangementId
          in: path
          required: true
          example: Arr_1
          description: arrangementId is the unique id for the systematic programs available in the policy
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystematicProgramUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                success:
                  $ref: '#/components/examples/successTransactionResponsewithoutQuote'
        '400':
          description: OneTime Premium Failure Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                failure:
                  $ref: '#/components/examples/failureTransactionResponse'

        '500':
          description: Unexpected error occured, please check server logs
      security:
        - Auth0:
            - read:policy

components:
  schemas:
    LoanRepaymentOneTimeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/LoanRepaymentOneTime'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
    NewLoanRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/NewLoan'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    FullSurrenderRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/FullSurrender'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: BPM will have to override the rules if this variable is marked as true
    PartialWithdrawalOneTimeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartialWithdrawalOneTime'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: BPM will have to override the rules if this variable is marked as true
    OneTimePremiumRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/OneTimePremiumTransaction'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: BPM will have to override the rules if this variable is marked as 'true'
    SystematicProgramUpdateRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/SystematicProgramUpdate'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    AddressChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/AddressChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: Flag for delete or update request. If flag==true then Delete Request else Update Request
          default: false
    TransactionAcceptedResponse:
      type: object
      properties:
        correlationId:
          type: string
          description: Unique identifier which used by every system to trace the request
        caseId:
          type: string
          description: Zinnia Live Case ID
        caseStatus:
          type: string
          description: Zinnia Live Case Status
    TransactionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - failure
        error:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        quoteResponse:
          type: object
    Error:
      type: object
      properties:
        errorCode:
          type: string
          example: 'BPM.NM.002'
          description: 'This is the NIGO id generated by BPM system'
        attribute:
          type: string
        error:
          type: string
          description: 'This is the error generated by BPM system'
        resolution:
          type: string
          description: 'Resolution generated by BPM system to resolve the error'
    EmailChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/EmailChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: Flag for delete or update request. If flag==true then Delete Request else Update Request
          default: false
    PhoneChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/PhoneChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: Flag for delete or update request. If flag==true then Delete Request else Update Request
          default: false
    BankAccountChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/BankAccountChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: Flag for delete or update request. If flag==true then Delete Request else Update Request
          default: false
    CommunicationPreferenceChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/CommunicationPreferenceChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    PartyNameChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartyNameChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    PartyChangeRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartyChange'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: Flag for delete or update request. If flag==true then Delete Request else Update Request
          default: false
    CancelTransactionRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/CancelTransaction'
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
      # System of Record Schemas
      # System of Record OneTimePremium
    CancelTransaction:
      type: object
      properties:
        correlationId:
          type: string
          example: 657b717b7dcf554abf9ef067
        transactionId:
          type: string
          example: '377'
        reason:
          type: string
          description: Reason for cancellation
          example: Entered Incorrect Email Id
    OneTimePremiumTransaction:
      type: object
      properties:
        correlationId:
          type: string
          example: 657b717b7dcf554abf9ef067
          description: The unique ID to track transaction request across all systems
        effectiveDate:
          type: string
          format: date
          example: 2023-01-01
          description: Date when the transaction was originally scheduled or expected to happen. It can be a non-business day
        reverseInitiator:
          type: boolean
          description: Property to isolate source transaction(s) that initiated the reversal
        transactionAmounts:
          type: object
          properties:
            requestedAmount:
              type: number
              description: Requested amount value
        payor:
          type: object
          properties:
            partyId:
              type: string
              description: Impacted Party in the event of financial transaction
            paymentForm:
              type: string
              enum:
                - DTCC
                - EFT
                - ACH
                - CHECK
              description: Mode of payment
            bankId:
              type: string
              description: Comes in Acord 103
    #Zahara SystematicProgramUpdate
    LoanRepaymentOneTime:
      type: object
      properties:
        correlationId:
          type: string
          example: 657b717b7dcf554abf9ef067
          description: The unique ID to track transaction request across all systems
        effectiveDate:
          type: string
          format: date
          example: '2023-01-01'
          description: 'Date (with pattern "yyyy-mm-dd") when the transaction was originally scheduled or expected to happen, can be a non-business day'
        reverseInitiator:
          type: boolean
          description: Property to isolate source transaction(s) that initiated the reversal
        transactionAmounts:
          type: object
          properties:
            requestedAmount:
              type: number
              example: 1000
              description: Requested amount value
        fundAllocation:
          type: object
          properties:
            allocationOption:
              $ref: '#/components/schemas/AllocationOption'
        payor:
          $ref: '#/components/schemas/AdhocParty'
    NewLoan:
      type: object
      properties:
        correlationId:
          type: string
          example: 657b717b7dcf554abf9ef067
          description: The unique ID to track transaction request across all systems
        effectiveDate:
          type: string
          format: date
          example: '2023-01-01'
          description: 'Date (with pattern "yyyy-mm-dd") when the transaction was originally scheduled or expected to happen, can be a non-business day'
        reverseInitiator:
          type: boolean
          description: Property to isolate source transaction(s) that initiated the reversal
        transactionAmounts:
          $ref: '#/components/schemas/AdhocTransactionAmount'
        fundAllocation:
          $ref: '#/components/schemas/AdhocFundAllocation'
        taxWithholdingInstructions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TaxWithholdingInstructions'
              - type: object
                properties:
                  partyRole:
                    $ref: '#/components/schemas/PartyRole'
    FullSurrender:
      type: object
      properties:
        correlationId:
          type: string
          example: 657b717b7dcf554abf9ef067
          description: The unique ID to track transaction request across all systems
        effectiveDate:
          type: string
          format: date
          example: '2023-01-01'
          description: 'Date (with pattern "yyyy-mm-dd") when the transaction was originally scheduled or expected to happen, can be a non-business day'
        reverseInitiator:
          type: boolean
          description: Property to isolate source transaction(s) that initiated the reversal
        override:
          type: boolean
          description: BPM will have to override the rules if this variable is marked as true
        taxWithholdingInstructions:
          type: array
          items:
            $ref: '#/components/schemas/TaxWithholdingInstructions'
        payeeOrBeneficiary:
          type: array
          items:
            $ref: '#/components/schemas/PayeeOrBeneficiary'
        transactionAmounts:
          $ref: '#/components/schemas/FullSurrenderActual.TransactionAmounts'
        charges:
          type: array
          items:

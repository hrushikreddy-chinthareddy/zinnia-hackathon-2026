openapi: 3.0.3
info:
  title: Case Management API
  description: Maintains cases and tasks apis related to the policy lifecycle.
  version: 1.0.0
servers:
  - url: https://dev.api.zinnia.io/
    description: 'Dev Environment'
  - url: https://qa.api.zinnia.io/
    description: 'QA Environment'
  - url: https://uat.api.zinnia.io/
    description: 'UAT Environment'
  - url: https://api.zinnia.io/
    description: 'PROD Environment'
tags:
  - name: Case Instance
    description: Manages cases for all processes
  - name: Task Instance (Legacy)
    description: Legacy - Manages tasks based on cases. Used for Withdrawal/Renewal. No further changes accepted.
  - name: Task Instance (Task Management)
    description: Manages tasks based on cases. Implemented using Zinnia live Task management framework.
  - name: Reference data
    description: Reference data applicable for cases

paths:
  /case/v1/cases/search:
    post:
      summary: Search cases
      tags:
        - Case Instance
      description: Get list of available case instances
      operationId: getCaseInstanceList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasePageSearchCriteria'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListInstanceResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/stats:
    post:
      summary: Case stats
      tags:
        - Case Instance
      description: Get Stats for available cases
      operationId: getCaseInstanceStats

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseStatsSearchCriteria'
      responses:
        '200':
          description: Case stats retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseStatsSearchResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}:
    get:
      summary: Get Case Detail
      tags:
        - Case Instance
      description: Get case instance detail
      operationId: getCaseInstanceById
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Case details retreived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/taskLink:
    get:
      summary: Get task links
      tags:
        - Case Instance
      description: Get list of available task instances for caseId
      operationId: getTaskInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: task link retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLinkInstanceList'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/note:
    get:
      summary: Get notes
      tags:
        - Case Instance
      description: Get list of available note instances for caseId
      operationId: getNoteInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: notes retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/stage:
    get:
      summary: Get case stages
      tags:
        - Case Instance
      description: Get list of available stage instances for caseId
      operationId: getStageInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: stages retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageListInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/document:
    get:
      summary: Get case documents
      tags:
        - Case Instance
      description: Get list of available document instances for caseId
      operationId: getDocumentInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: documents retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/exception:
    get:
      summary: Get case exceptions
      tags:
        - Case Instance
      description: Get list of available exception instances for caseid
      operationId: getExceptionInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: exceptions retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/event:
    get:
      summary: Get case events
      tags:
        - Case Instance
      description: Get list of available event instances for caseid
      operationId: getEventTimeLineInstanceByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string
        - name: fromTs
          in: query
          description: From time
          required: false
          schema:
            type: integer
            format: int64
        - name: toTs
          in: query
          description: To time
          required: false
          schema:
            type: integer
            format: int64
        - name: source
          in: query
          description: source
          required: false
          schema:
            type: string
      responses:
        '200':
          description: case events retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTimeLineInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/event/{eventId}:
    get:
      summary: Get event details
      tags:
        - Case Instance
      description: Get detail of event including payload
      operationId: getEventDetailByEventId
      parameters:
        - name: eventId
          in: path
          description: Event Id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: event details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailInstance'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases:
    post:
      tags:
        - Case Instance
      summary: Create Case
      description: Create case through provided input
      operationId: CreateCase
      requestBody:
        description: Case details for creation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
            examples:
              Renewal:
                value:
                  carrier: MASS
                  process: Renewal
                  identifiers:
                    - identifier: policyNumber
                      value: AU42046202
              Withdrawal:
                value:
                  carrier: SBGC
                  process: Withdrawal
                  identifiers:
                    - identifier: documentNumber
                      value: 20230714-EM-479402

        required: true
      responses:
        '201':
          description: Case Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseInstanceSummary'
              examples:
                Renewal:
                  value:
                    templateId: cde717c9-5f7e-4c63-953c-ef50e44c021a
                    carrier: MASS
                    process: Correspondence
                Withdrawal:
                  value:
                    templateId: cde717c9-5f7e-4c63-953c-ef50e44c021a
                    carrier: SBGC
                    process: Correspondence
                    caseStatus: IN_PROGRESS

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - write:case

  /case/v1/cases/{caseId}/tasks:
    post:
      tags:
        - Task Instance (Legacy)
      summary: Create Task for case
      description: Create task and associate with a case
      deprecated: true
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string
      operationId: CreateTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              Renewal:
                value:
                  taskType: RenewalTask
                  carrier: MASS
              Withdrawal:
                value:
                  taskType: WithdrawalTask
                  carrier: SBGC
        required: true
      responses:
        '201':
          description: Renewal task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
              examples:
                Renewal:
                  value:
                    taskId: string
                    caseId: string
                    taskType: RenewalTask
                Withdrawal:
                  value:
                    taskId: string
                    caseId: string
                    taskType: WithdrawalTask
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - write:task

    get:
      tags:
        - Task Instance (Legacy)
      summary: Get Tasks
      description: Get list of tasks for a case id
      operationId: GetTasksForCaseId
      deprecated: true
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: task instance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummaryList'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '404':
          description: Not found

        '500':
          description: Error in task submit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - 'read:task'

  /case/v1/cases/{caseId}/tasks/{taskId}:
    put:
      tags:
        - Task Instance (Legacy)
      summary: Update Task
      description: Updates task for a given case
      deprecated: true
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          description: Task instance id
          required: true
          schema:
            type: string
      operationId: UpdateTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'

        required: true
      responses:
        '200':
          description: Renewal task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - 'write:task'
    get:
      tags:
        - Task Instance (Legacy)
      summary: Get Task details
      description: Get Task details from a case with task id
      operationId: GetTaskForTaskIdForCase
      deprecated: true
      parameters:
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          description: Task instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: task details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '404':
          description: Not found

        '500':
          description: Error in retreiving task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - read:task

  /case/v1/tasks/{taskId}:
    get:
      tags:
        - Task Instance (Legacy)
      summary: Get Task
      description: Get Task
      operationId: GetTaskById
      deprecated: true
      parameters:
        - name: taskId
          in: path
          description: Task instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: task instance retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskInstance'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

        '404':
          description: Not found

        '500':
          description: Error in task submit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'

      security:
        - Auth0:
            - read:task

  /case/v1/cases/{caseId}/metadata:
    get:
      summary: Get case metadata
      tags:
        - Case Instance
      description: Get metadata from the template for the provided caseid
      operationId: getMetadataByCaseId
      parameters:
        - name: caseId
          in: path
          description: Case Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: case metadata retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateMetadataModel'
              examples:
                NewBusiness:
                  value:
                    stages:
                      requestAck:
                        steps:
                          requestAck.nbRequestReceived:
                            info: New Application has been received to ETP
                          requestAck.nbRequestValidation: {}
                          requestAck.draftContractCreation:
                            info: CTL will create the contract in the Admin System
                          requestAck.caseProcessing:
                            info: Case gets created in the OnBase
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Invalid case id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCaseResponse'
      security:
        - Auth0:
            - 'read:case'
  /case/v1/refdata:
    post:
      tags:
        - Reference data
      summary: Get reference data
      description: Get Reference data keys for the cases based on criteria
      operationId: GetReferenceDataForKeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefDataSearchCriteria'
      responses:
        '200':
          description: reference data for provided keys retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponse'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not found
        '500':
          description: Error in fetching reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0:
            - read:task

  /case/v1/tasks/search:
    post:
      summary: Task Management - Search tasks
      tags:
        - Task Instance (Task Management)
      description: Search tasks by case id for provided criteria
      operationId: getTaskInstanceListForTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskListSearchCriteria'
      responses:
        '200':
          description: tasks retrieved for provided search criterias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '404':
          description: Resource Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v2/tasks/{taskId}:
    get:
      tags:
        - Task Instance (Task Management)
      summary: Task Management - Get Task details
      description: Get Task details
      operationId: GetTaskDetailsById

      parameters:
        - name: taskId
          in: path
          description: Task instance id
          required: true
          schema:
            type: string
        - name: includeSchema
          in: query
          description: Whether schema should be included or not
          required: false
          schema:
            type: boolean
            default: false

      responses:
        '200':
          description: task details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailById'

        '404':
          description: Resource Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/cases/{caseId}/tasks/{taskId}/exceptions:
    get:
      tags:
        - Task Instance (Task Management)
      summary: Task Management - Get Exceptions
      description: Get exception details by task id
      operationId: GetExceptionByTaskId

      parameters:
        - name: taskId
          in: path
          description: Task instance id
          required: true
          schema:
            type: string
        - name: caseId
          in: path
          description: Case instance id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: exceptions for provided case and task retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListInstance'
        '404':
          description: Resource Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'

        '401':
          description: Authentication failed

        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'

      security:
        - Auth0:
            - read:case

  /case/v1/tasks/schema/{taskType}:
    get:
      summary: Task Management - Get schema
      tags:
        - Task Instance (Task Management)
      description: Get schema for taskType
      operationId: getSchemaForTaskType
      parameters:
        - name: taskType
          in: path
          description: Task type
          required: true
          schema:
            type: string
      responses:
        '200':
          description: schema for provided task type
          content:
            application/json:
              schema:
                type: object

        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Invalid task type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
      security:
        - Auth0:
            - 'read:case'

components:
  schemas:
    CaseInstance:
      type: object
      properties:
        _id:
          type: string
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
        templateId:
          type: string
          example: cde717c9-5f7e-4c63-953c-ef50e44c021a
        carrier:
          type: string
          example: MASS
        process:
          type: string
          example: Correspondence
        caseStatus:
          type: string
          example: IN_PROGRESS
        parentInstanceId:
          type: string
          example: 15ea7582-262f-4dfe-8a60-1e8b8e763fb1
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentInstance'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionInstance'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteInstance'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskLinkInstance'
        mappedTasks:
          type: array
          items:
            type: string
            example: CL12345
        mappedExceptions:
          type: array
          items:
            type: string
            example: NIGO123
        mappedNotes:
          type: array
          items:
            type: string
            example: IN4567

openapi: 3.0.1
info:
  title: Documents
  version: snapshot
servers:
  - url: https://dev.api.zinnia.io
    description: Dev Environment
  - url: https://qa.api.zinnia.io
    description: QA Environment
  - url: https://uat.api.zinnia.io
    description: UAT Environment
  - url: https://api.zinnia.io
    description: PROD Environment
paths:
  /document/v3/service-request-form/update/{documentId}:
    put:
      tags:
        - ServiceRequestForms V3
      summary: Updates a service request form using the provided ID
      description: >-
        Updates a service request form based on the given ID. The form details
        will be modified as per the provided information.
      operationId: updateSRFDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/ServiceRequestFormUpdateMetaData'
      responses:
        '204':
          description: service request form updated successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/ServiceRequestFormMetadataOperationsResponse
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRequest:
                  summary: Invalid input
                  description: InvalidRequest
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: Invalid request format
                    responseCode: 400
                MissingField:
                  summary: Missing required field
                  description: MissingField
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: "'documentType' is required"
                    responseCode: 400
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AccessDenied:
                  summary: Access denied
                  description: AccessDenied
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: User not authorized to perform this action
                    responseCode: 403
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnexpectedError:
                  summary: Unexpected server error
                  description: UnexpectedError
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: An unexpected error occurred
                    responseCode: 500
  /document/v3/documents/{documentId}:
    get:
      tags:
        - Documents V3
      summary: gets metadata for a document
      description: fetches metadata details, including version history if requested
      operationId: getMetadataByDocumentId
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: isAllVersionsNeeded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: documentType
          in: query
          required: false
          schema:
            type: string
        - name: documentClassification
          in: query
          required: false
          schema:
            type: string
            enum:
              - INBOUND
              - OUTBOUND
        - name: parentCarrierCode
          in: query
          required: false
          schema:
            type: string
        - name: isSEDDocumentId
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: history
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: document metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
        '400':
          description: document metadata retrieval failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
        '404':
          description: document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
    put:
      security:
        - Auth0: []
      tags:
        - Documents V3
      summary: updates document content or metadata
      description: modifies metadata and optionally replaces the file
      operationId: updateDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/MetadataUpdate'
      responses:
        '204':
          description: document updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '400':
          description: document update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
  /document/v3/documents/bulk:
    put:
      tags:
        - Documents V3
      summary: updates multiple documents
      description: applies metadata changes in bulk
      operationId: updates multiple documents
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Metadata'
        required: true
      responses:
        '200':
          description: documents updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
        '400':
          description: documents update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
  /document/v3/service-request-form/upload:
    post:
      tags:
        - ServiceRequestForms V3
      summary: Uploads a service request form and saves its details
      description: >-
        Uploads a service request form and stores its details in the system. A
        document ID will be provided for reference.
      operationId: uploadServiceRequestForm
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/ServiceRequestFormMetaData'
      responses:
        '201':
          description: Service request form uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestFormUploadResponse'
        '400':
          description: Service request form upload failed
          content:
            application/json:
              examples:
                InvalidRequest:
                  summary: Invalid input
                  description: InvalidRequest
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: Invalid request format
                    responseCode: 400
                MissingField:
                  summary: Missing required field
                  description: MissingField
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: "'documentType' is required"
                    responseCode: 400
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AccessDenied:
                  summary: Access denied
                  description: AccessDenied
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: User not authorized to perform this action
                    responseCode: 403
        '500':
          description: Internal server error occurred while processing the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnexpectedError:
                  summary: Unexpected server error
                  description: UnexpectedError
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: An unexpected error occurred
                    responseCode: 500
  /document/v3/service-request-form/search:
    post:

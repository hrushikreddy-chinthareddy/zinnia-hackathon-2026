      responses:
        '200':
          description: service request forms retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchServiceRequestFormResponse'
        '400':
          description: service request forms retrieval failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRequest:
                  summary: Invalid input
                  description: InvalidRequest
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: Invalid request format
                    responseCode: 400
                MissingField:
                  summary: Missing required field
                  description: MissingField
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: "'documentType' is required"
                    responseCode: 400
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AccessDenied:
                  summary: Access denied
                  description: AccessDenied
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: User not authorized to perform this action
                    responseCode: 403
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnexpectedError:
                  summary: Unexpected server error
                  description: UnexpectedError
                  value:
                    correlationId: 123e4567-e89b-12d3-a456-426614174000
                    isSuccess: false
                    message: An unexpected error occurred
                    responseCode: 500
  /document/v3/documents:
    post:
      security:
        - Auth0: []
      tags:
        - Documents V3
      summary: uploads a document and saves its metadata
      description: accepts a file with metadata and returns a document ID
      operationId: uploadDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: document stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          description: document storage failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
    delete:
      security:
        - Auth0: []
      tags:
        - Documents V3
      summary: removes multiple documents
      description: deletes documents based on provided IDs
      operationId: deleteDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example:
                - 6753587970cba5484a244cd2
                - 6753587970cba5484a244cd3
                - 6753587970cba5484a244cd4
              description: List of document IDs to be deleted
        required: true
      responses:
        '204':
          description: Documents deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '400':
          description: Document deletion failed for one or more documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
  /document/v3/documents/search:
    post:
      security:
        - Auth0: []
      tags:
        - Documents V3
      summary: searches for documents
      description: >-
        finds documents based on filters like document classification, document
        type, policy number etc
      operationId: searchDocuments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            maximum: 1000
            type: integer
            format: int32
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: documents retrieval failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
  /document/v3/documents/delete:
    post:
      security:

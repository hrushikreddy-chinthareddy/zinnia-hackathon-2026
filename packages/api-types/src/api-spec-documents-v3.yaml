        otherwise, a public URL to access the form is provided.
      operationId: downloadSRFDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: documentClassification
          in: query
          required: false
          schema:
            type: string
            enum:
              - INBOUND
              - OUTBOUND
        - name: parentCarrierCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: service request form downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestFormDownloadResponse'
        '400':
          description: service request form download failed
          content:
            application/json:
              schema:

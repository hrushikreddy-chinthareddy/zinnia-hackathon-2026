openapi: 3.1.0
info:
  title: Analytics Data API
  description: Provides analytics data for the Zinnia Life platform
  contact:
    name: Data Team
    email: data-science@se2office365.onmicrosoft.com
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: Local Dev
  - url: https://dev.api.zinnia.io
    description: Dev Environment

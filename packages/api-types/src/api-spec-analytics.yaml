        - name: env_space
          in: query
          required: false
          schema:
            type: string
            title: Env Space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletedCaseTimeInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedCaseTimeOutput'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal Server Error
        '502':
          description: Auth service unreachable
        '504':
          description: Auth service timeout after 2.0s

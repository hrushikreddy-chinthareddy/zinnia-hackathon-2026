components:
  schemas:
    CaseCountGroupByEnum:
      type: string
      enum:
        - brokerDealerName
        - carrier
        - caseStatus
        - processSubType
        - process
        - productName
        - applicationType
        - caseResult
        - createdDay
        - updatedDay
      title: CaseCountGroupByEnum
    CaseCountInput:
      properties:
        filter:
          $ref: '#/components/schemas/CaseCountInputFilter'
        groupBy:
          items:
            $ref: '#/components/schemas/CaseCountGroupByEnum'
          type: array
          maxItems: 3
          minItems: 1
          title: Groupby
          example:
            - carrier
      type: object
      required:
        - filter
        - groupBy
      title: CaseCountInput
    CaseCountInputFilter:
      properties:
        caseStatus:
          anyOf:
            - items:
                type: string
              type: array
          title: Casestatus
          example:
            - COMPLETED
        carrier:
          anyOf:
            - items:
                type: string
              type: array
          title: Carrier
          example:
            - MASS
        process:
          anyOf:
            - items:
                type: string
              type: array
          title: Process
          example:
            - New Business
        requestSubType:
          anyOf:
            - items:
                type: string
              type: array
          title: Requestsubtype
          example:
            - Suitability Review
        productName:
          anyOf:
            - items:
                type: string
              type: array
          title: Productname
          example:
            - Security Benefit Foundations Annuity 5 Yr product
        brokerDealerName:
          anyOf:
            - items:
                type: string
              type: array
          title: Brokerdealername
          example:
            - SANTANDER  SECURITIES LLC
        caseResult:
          anyOf:
            - items:
                type: string
              type: array
          title: Caseresult
          example:
            - Issued
        createdDateStart:
          anyOf:
            - type: string
              format: date-time
          title: Createddatestart
          example: '2025-01-11T01:01:31.316Z'
        createdDateEnd:
          anyOf:
            - type: string
              format: date-time
          title: Createddateend
          example: '2025-01-21T23:34:31.316Z'
        updatedDateStart:
          anyOf:
            - type: string
              format: date-time
          title: Updateddatestart
          example: '2025-01-11T01:01:01.316Z'
        updatedDateEnd:
          anyOf:
            - type: string
              format: date-time
          title: Updateddateend
          example: '2025-01-21T23:34:31.316Z'
      type: object
      title: CaseCountInputFilter
    CaseCountOutput:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CaseCountOutputLevel1'
          type: array
          title: Data
        totalElements:
          type: integer
          title: Totalelements
          example: 12345
      type: object
      required:
        - data
        - totalElements
      title: CaseCountOutput
    CaseCountOutputLevel1:
      properties:
        key:
          type: string
          title: Key
          example: carrier
        name:
          type: string
          title: Name
          example: MASS
        count:
          type: integer
          title: Count
          example: 5832
        values:
          anyOf:
            - items:
                $ref: '#/components/schemas/CaseCountOutputLevel2'
              type: array
          title: Values
      type: object
      required:
        - key
        - name
        - count
      title: CaseCountOutputLevel1
    CaseCountOutputLevel2:
      properties:
        key:
          type: string
          title: Key
          example: processSubType
        name:
          type: string
          title: Name
          example: Annuity Application
        count:
          type: integer
          title: Count
          example: 2294
        values:
          anyOf:
            - items:
                $ref: '#/components/schemas/CaseCountOutputLevel3'
              type: array
          title: Values
      type: object
      required:
        - key
        - name
        - count
      title: CaseCountOutputLevel2
    CaseCountOutputLevel3:
      properties:
        key:
          type: string
          title: Key
          example: applicationType
        name:
          type: string
          title: Name
          example: Digital
        count:
          type: integer
          title: Count
          example: 28
      type: object
      required:
        - key
        - name
        - count
      title: CaseCountOutputLevel3
    CaseTimePredictInput:
      properties:
        caseId:
          type: string
          title: Caseid
          example: CA0000493923
      type: object
      title: CaseTimePredictInput
    CaseTimePredictOutput:
      properties:

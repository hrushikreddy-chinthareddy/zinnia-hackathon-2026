name: 'Deploy Consumer Experience Based on Environment'

on:
  workflow_call:
    inputs:
      environment-level:
        required: true
        type: string
      push-build:
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (east)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DIGITAL_EXPERIENCE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DIGITAL_EXPERIENCE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION_EAST }}

      - name: Login to Amazon ECR (east)
        id: login-ecr-east
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definition (east)
        run: |
          aws ecs describe-task-definition --task-definition ${{ vars.ECS_TASK_NAME_CONSUMER_EXPERIENCE }} --query taskDefinition > east-task-definition.json

      - name: Build, tag, and push image to Amazon ECR with action
        id: build_image
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-east.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: 'apps/consumer-experience/Dockerfile'
          push: ${{ inputs.push-build == true }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY_CONSUMER_EXPERIENCE }}
            ${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY_CONSUMER_EXPERIENCE }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY_CONSUMER_EXPERIENCE }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL_CONSUMER_EXPERIENCE }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL_CONSUMER_EXPERIENCE }}
            NEXT_PUBLIC_DATADOG_APPLICATION_ID=${{ vars.NEXT_PUBLIC_DATADOG_APPLICATION_ID_CONSUMER_EXPERIENCE }}
            NEXT_PUBLIC_DATADOG_CLIENT_TOKEN=${{ vars.NEXT_PUBLIC_DATADOG_CLIENT_TOKEN_CONSUMER_EXPERIENCE }}
            NEXT_PUBLIC_DATADOG_ENV=${{ vars.NEXT_PUBLIC_DATADOG_ENV }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SEGMENT_ANALYTICS_KEY=${{vars.NEXT_PUBLIC_SEGMENT_ANALYTICS_KEY_CONSUMER}}
          secrets: |
            "npmtoken=${{ secrets.GITHUB_TOKEN }}"
            "DATADOG_API_KEY=${{ secrets.DATADOG_API_KEY }}"

      - name: Fill in the new image ID in the Amazon ECS task definition (east)
        id: task-def-east
        uses: aws-actions/amazon-ecs-render-task-definition@v1.6.1
        with:
          task-definition: east-task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.login-ecr-east.outputs.registry }}/${{ vars.ECR_REPOSITORY_CONSUMER_EXPERIENCE }}:${{ github.sha }}

      - name: Deploy Amazon ECS Task Definition (east)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.2.0
        with:
          task-definition: ${{ steps.task-def-east.outputs.task-definition }}
          service: ${{ secrets.ECS_CLUSTER_SERVICE_CONSUMER_EXPERIENCE }}
          cluster: ${{ secrets.ECS_CLUSTER_CONSUMER_EXPERIENCE }}
          wait-for-service-stability: true

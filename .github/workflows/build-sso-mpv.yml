name: 'Build SSO MPV'

on:
  workflow_call:
    inputs:
      environment-level:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Prune SSO-MPV
        run: npx turbo prune sso-mpv --docker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (east)
        id: login-ecr-east
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push SSO-MPV Docker Image
        id: sso_mpv_build
        uses: docker/build-push-action@v5
        with:
          context: ./out
          file: ./out/apps/sso-mpv/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr-east.outputs.registry }}/${{ vars.ECR_REPOSITORY_SSO_MPV }}
            ${{ steps.login-ecr-east.outputs.registry }}/${{ vars.ECR_REPOSITORY_SSO_MPV }}:${{ github.sha }}
            ${{ steps.login-ecr-east.outputs.registry }}/${{ vars.ECR_REPOSITORY_SSO_MPV }}:latest

      - name: Fill in the new image ID in the Amazon ECS task definition (east)
        id: task-def-east
        uses: aws-actions/amazon-ecs-render-task-definition@v1.6.1
        with:
          task-definition: east-task-definition.json
          container-name: ${{ vars.CONTAINER_NAME_SSO_MPV }}
          image: ${{ steps.login-ecr-east.outputs.registry }}/${{ vars.ECR_REPOSITORY_SSO_MPV }}:${{ github.sha }}

      - name: Deploy Amazon ECS Task Definition (east)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.2.0
        with:
          task-definition: ${{ steps.task-def-east.outputs.task-definition }}
          service: ${{ secrets.ECS_CLUSTER_SERVICE_SSO_MPV }}
          cluster: ${{ secrets.ECS_CLUSTER_SSO_MPV }}
          wait-for-service-stability: true

name: 'Production Portal Frontend Deployment'

on:
  workflow_dispatch:

jobs:
  prod-deploy-east:
    if: startsWith(github.ref_name, 'release/')
    uses: ./.github/workflows/deploy-ops-east.yml
    with:
      environment-level: production
    secrets: inherit

  create-release-tag:
    needs: prod-deploy-east
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from branch name
        id: extract-version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed -E 's/release\/zinnia-live-v?/v/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract-version.outputs.version }}
          name: Zinnia Live ${{ steps.extract-version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}

  notify-slack:
    needs: create-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on production release
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Zinnia Live Production Release — ${{ needs.create-release-tag.outputs.version }} deployed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Zinnia Live Production Release — ${{ needs.create-release-tag.outputs.version }} deployed successfully!*\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.create-release-tag.outputs.version }}|View Release on GitHub>"
                  }
                }
              ]
            }

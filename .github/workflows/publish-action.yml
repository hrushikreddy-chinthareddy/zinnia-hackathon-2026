name: Manually Publish Package to Github NPM Registry

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'If true will only dry-run a publish'
        required: false
        default: true
        type: boolean
      package-name:
        description: 'Name of package to publish'
        required: true
        type: choice
        options:
          - "api-types"
          - "eslint-config"
          - "prettier-config"
          - "typescript-config"
          - "utils"
      node-version-file:
        type: string
        required: false
        default: .nvmrc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zinnia'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --filter @zinnia/${{ inputs.package-name }}
      - run: pnpm run test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: .nvmrc
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@zinnia'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install modules
        run: pnpm install --filter @zinnia/${{ inputs.package-name }}
      - name: Build Package
        run: pnpm run build --filter @zinnia/${{ inputs.package-name }}

      - name: Test deploy package
        if: inputs.dry-run == true
        run: |
          cd packages/${{ inputs.package-name }} &&\
          npm publish --tag ${{ github.ref_name }} --dry-run --no-git-checks
      - name: Deploy with `latest` tag
        if: inputs.dry-run == false
        run: |
          cd packages/${{ inputs.package-name }} &&\
          npm publish --tag latest

name: 'Pull Request Checks'

on:
  pull_request:
    branches:
      - dev
      - release/*
      - feature/*
      - hotfix/*
      - fix/*
      - patch/*
      - feat/*

jobs:
  pr-description-check:
    name: Check PR Description and JIRA Link
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Check PR description contains JIRA ID and TAS ticket
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jiraRegex = /\[?[A-Za-z]{2,10}-\d{1,7}\]?/g;
            const tasRegex = /TAS-\d+/g;
            const title = context.payload.pull_request.title || "";
            const description = (context.payload.pull_request.body || "").trim();
            const combined = title + "\n" + description;

            console.log("🔍 PR Title:", title);
            console.log("🔍 PR Description:", description);

            const matches = combined.match(jiraRegex);
            const tasMatches = description.match(tasRegex);
            console.log("🔍 Matched JIRA IDs:", matches);
            console.log("🔍 Matched TAS tickets:", tasMatches);

            let failed = false;

            if (!combined) {
              core.setFailed("❌ PR description is missing. Please add a description.");
              failed = true;
            } else if (!matches) {
              core.setFailed("❌ JIRA ticket ID (e.g., DEPU-123) is missing in the PR title or description.");
              failed = true;
            }

            if (!tasMatches) {
              core.setFailed("❌ TAS ticket (e.g., TAS-26027) is missing in the PR description. Please fill out the 'What is the TAS ticket for this PR?' section.");
              failed = true;
            }

            if (!failed) {
              console.log("✅ PR description checks passed (JIRA ID and TAS ticket found).");
            }

  prettier-typecheck-lint:
    name: Prettier, Type Check, and Lint
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@zinnia'
          cache: 'pnpm'
      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile
      - name: Run prettier, type checks, and lint
        run: npx turbo prettier && npx turbo check-types && npx turbo lint

  test:
    name: Test All Apps
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@zinnia'
          cache: 'pnpm'
      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile
      - run: npx turbo test

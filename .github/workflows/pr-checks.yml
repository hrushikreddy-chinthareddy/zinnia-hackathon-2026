name: 'Pull Request Checks'

on:
  pull_request:
    branches:
      - dev
      - release/*
      - feature/*
      - hotfix/*
      - fix/*
      - patch/*
      - feat/*

jobs:
  pr-description-check:
    name: Check PR Description and JIRA Link
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Check PR description contains JIRA ID
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jiraRegex = /\[?[A-Za-z]{2,10}-\d{1,7}\]?/g;
            const title = context.payload.pull_request.title || "";
            const description = (context.payload.pull_request.body || "").trim();
            const combined = title + "\n" + description;

            console.log("🔍 PR Title:", title);
            console.log("🔍 PR Description:", description);

            const matches = combined.match(jiraRegex);
            console.log("🔍 Matched JIRA IDs:", matches);

            if (!combined) {
              core.setFailed("❌ PR description is missing. Please add a description.");
            } else if (!matches) {
              core.setFailed("❌ JIRA ticket ID (e.g., ABC-123) is missing in the PR title or description.");
            } else {
              console.log("✅ PR description/title JIRA ID check passed.");
            }

  prettier-typecheck-lint:
    name: Prettier, Type Check, and Lint
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@zinnia'
          cache: 'pnpm'
      - name: Configure npm auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
      - name: Clean monorepo deps
        run: rm -rf node_modules apps/*/node_modules
      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile
      - name: Run prettier
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npx turbo prettier
      - name: Build dependent workspace packages
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm --filter '!./apps/ops' --filter '!./apps/consumer-experience' build
      - name: Run type checks
        run: npx turbo check-types
      - name: Build ops dependencies
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm --filter './apps/ops' --filter './apps/consumer-experience' build
      - name: Run lint
        run: |
          npx turbo lint

  test:
    name: Test All Apps
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@zinnia'
          cache: 'pnpm'
      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile
      - run: npx turbo test

name: Portal Frontend Dev to UAT

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy to the UAT environment"
        required: true
        default: "dev"
        type: string

jobs:
  dev-deploy-east:
    # Deploy whatever ref the user selected (defaults to dev)
    uses: ./.github/workflows/deploy-ops-east.yml
    with:
      environment-level: uat
      # Pass the selected branch/tag to the reusable workflow
      ref: ${{ inputs.ref }}
    secrets: inherit

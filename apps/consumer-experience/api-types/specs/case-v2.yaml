      summary: Search for exception references and its sub reference details
      tags:
        - Exception Reference
      requestBody:
        description: >-
          Criteria for searching exception references and its sub reference
          details
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionRefDetailsSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExceptionRefDetailsModel'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '500':
          description: Error occurred while searching exception reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
  /case/v1/exceptionrefs/{nmId}:
    get:
      summary: Find an exception reference by NM ID
      tags:
        - Exception Reference
      parameters:
        - in: path
          name: nmId
          required: true
          schema:
            type: string
            example: EM.053
      responses:
        '200':
          description: Exception reference found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionReferenceModel'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Exception reference not found
        '500':
          description: Error in fetching exception reference for specified id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
    put:
      summary: Update an exception reference
      tags:
        - Exception Reference
      parameters:
        - in: path
          name: nmId
          required: true
          schema:
            type: string
      requestBody:
        description: Updated exception reference details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionReferenceRequest'
      responses:
        '200':
          description: Exception reference updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionReferenceModel'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Exception reference not found
        '500':
          description: Error in updating exception reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
  /case/v1/dashboard/stats:
    post:
      summary: Get the Stats for the Dashboard
      tags:
        - Dashboard
      requestBody:
        description: Get Dashboard Stats Model Search Body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardStatsRequest'
      responses:
        '200':
          description: The updated queue instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
              example:
                data:
                  - key: brokerDealerName
                    name: Broker 1
                    count: 3990
                    values:
                      - key: process
                        name: Process 1
                        count: 3990
                        values:
                          - key: caseStatus
                            name: EXCEPTION
                            count: 2396
                          - key: caseStatus
                            name: IN_PROGRESS
                            count: 1192
                          - key: caseStatus
                            name: COMPLETED
                            count: 388
                          - key: caseStatus
                            name: CANCELED
                            count: 14
                  - key: brokerDealerName
                    name: Broker 2
                    count: 866
                    values:
                      - key: process
                        name: Process 1
                        count: 866
                        values:
                          - key: caseStatus
                            name: IN_PROGRESS
                            count: 448
                          - key: caseStatus
                            name: EXCEPTION
                            count: 225
                          - key: caseStatus
                            name: COMPLETED
                            count: 187
                          - key: caseStatus
                            name: CANCELED
                            count: 6
                totalElements: 4856
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Queue instance not found
        '500':
          description: Error in Updating a specific queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
  /case/v1/refdata/{refType}/tree:
    get:
      tags:
        - Reference data
      summary: Retrieve Reference Data Hierarchy
      description: >-
        Retrieves a hierarchical structure of reference data based on the
        specified type as parent.
      operationId: retrieveReferenceDataHierarchy
      parameters:
        - name: refType
          in: path
          required: true
          description: The starting parent type in the hierarchy.
          example: DOCUMENT_CATEGORY
          schema:
            type: string
      responses:
        '200':
          description: Retrieved Document hierarchical reference data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponseTree'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not found
        '500':
          description: Error in fetching reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
  /case/v1/refdata/{type}:
    get:
      tags:
        - Reference data
      summary: Fetch List of reference data by Type and Parent Key
      description: Fetch List of reference data by Type and Parent Key
      operationId: fetchReferenceDataByTypeAndParentKey
      parameters:
        - name: type
          in: path
          required: true
          description: The type of reference data to retrieve.
          schema:
            type: string
        - name: parentKey
          in: query
          required: false
          description: >-
            The key of the parent entity whose Reference Data are to be
            retrieved.
          schema:
            type: string
      responses:
        '200':
          description: A list of reference data models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceResponseModel'
        '401':
          description: Authentication failed
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
        '404':
          description: Not found
        '500':
          description: Error in fetching reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
      security:
        - Auth0: []
components:
  schemas:
    TaskSearchCriteria:
      type: object
      properties:
        policyNumber:
          type: string
          description: The policy number associated with the case.
          example: AU7654098
        applicationType:
          type: string
          description: The application type of the policy.
          example: Digital
        process:
          type: array
          description: A list of processes to filter the search results.
          items:
            type: string
          example:
            - New Business
    DashboardStatsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: brokerDealerName
              name:
                type: string
                example: Example Broker
              count:
                type: integer
                example: 3990
              values:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      example: process
                    name:
                      type: string
                      example: Process 1
                    count:
                      type: integer
                      example: 3990
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            example: caseStatus
                          name:
                            type: string
                            example: EXCEPTION
                          count:
                            type: integer
                            example: 2396
        totalElements:
          type: integer
          example: 4856
    DashboardStatsRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/DashboardSearchRequest'
        groupBy:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - brokerDealerName
              - carrier
              - caseStatus
              - processSubType
              - policyNumber
              - process
              - productName
              - expectionCategory
              - openStages
              - updatedAt
              - createdAt
    DashboardSearchRequest:
      type: object
      properties:
        policyNumber:
          type: string
          description: The policy number associated with the case.
          example: AU7654098
        applicationType:
          type: string
          description: The application type of the policy.
          example: Digital
        process:
          type: array
          description: A list of processes to filter the search results.
          items:
            type: string
          example:
            - New Business
        carrier:
          type: array
          description: A list of carrier to filter the search results.
          items:
            type: string
          example:
            - Carrier 1
            - Carrier 2
        requestSubType:
          type: array
          description: A list of request subtypes to filter the search results.
          items:
            type: string
          example:
            - INTERNAL CONVERSION
        productName:
          type: array
          description: A list of product names to filter the search results.
          items:
            type: string
          example:
            - TOTAL INTEREST ANUITY APPLICATION
        caseStatus:
          type: array
          description: A list of case statuses to filter the search results.
          items:
            type: string
          example:
            - Exception
        createdDateStart:
          type: string
          description: The start date for the creation date range filter.
          format: date-time
        createdDateEnd:
          type: string
          format: date-time
          description: The end date for the creation date range filter.
        updatedDateStart:
          type: string
          format: date-time
          description: The start date for the updated date range filter.
        updatedDateEnd:
          type: string
          format: date-time
          description: The end date for the updated date range filter.
        brokerDealerName:
          type: array
          description: A list of broker dealer names to filter the search results.
          items:
            type: string
          example:
            - Broker 1
            - Broker 2
    CaseInstance:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the case instance.
        templateId:
          type: string
          description: Identifier for the template associated with the case instance.
        carrier:
          type: string
          description: Name of the carrier associated with transaction/case.
        process:
          type: string
          description: Name of the process/transaction type for case.
        caseGroup:
          type: string
          description: Name of the caseGroup type for case.
        parentInstanceId:
          type: string
          description: Identifier for the parent case instance, if applicable.
        correlationId:
          type: string
          description: Identifier used for correlating events as they received.
        caseStatus:
          description: Current status of the case instance.
          type: string
          enum:
            - IN_PROGRESS
            - EXCEPTION
            - COMPLETED
            - CANCELED
        caseResult:
          description: >-
            Contextual information regarding the caseStatus especially when case
            is marked as canceled
          type: string
        caseResultDetail:
          description: Detailed contextual information regarding the caseStatus
          type: string
        primary:
          type: boolean
          description: Indicates if this is the primary case instance.
        caseProcessingDetails:
          type: array
          description: List of detail sections for case processing.
          items:
            type: object
            properties:
              detailType:
                type: string
                description: >-
                  Type of the detail section (e.g., "submissionDetails",
                  "executionDetails").
                example: submissionDetails
              properties:
                type: array
                description: List of properties for the detail section.
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: >-
                        Identifier for the property (e.g., "submittedBy",
                        "submissionSource").
                      example: submittedBy
                    value:
                      type: string
                      description: Value of the property.
                      example: MANUAL
        linkDetails:
          type: object
          description: Details about linked case instances.
          properties:
            linkedCaseInstanceId:
              type: string
              description: Identifier of the linked case instance.
            linkedReason:
              type: string
              description: >-
                Reason for linking the case instances. It could be identified by
                case management system or by some external system
        processSubType:
          type: string
          description: Subtype of the process/transaction associated with the case.
        policyNumber:
          type: string
          description: Policy number/Contract No associated to the case instance.
        planCode:
          type: string
          description: PlanCode associated to the case instance.
        productName:
          description: Name of the product associated with Contract/Policy.
          type: string
        documents:
          type: array
          description: List of document associated to the case. (DEPRECATED)
          deprecated: true
          items:
            $ref: '#/components/schemas/DocumentInstance'
        exceptions:
          description: List of all exceptions/NIGOs associated related to the case.
          type: array
          items:
            $ref: '#/components/schemas/ExceptionInstance'
        notes:
          type: array
          description: List of all note associated to the case.
          items:
            $ref: '#/components/schemas/NoteInstance'
        tasks:
          type: array
          description: >-
            List of all tasks associated to the case irrespective of different
            stage/steps.
          items:
            $ref: '#/components/schemas/TaskLinkInstance'
        mappedTasks:
          type: array
          description: >-
            List of Task Identifiers which directly linked to Case (RESERVED FOR
            FUTURE SCOPE)
          items:
            type: string
        mappedExceptions:
          type: array
          description: >-
            List of Exception/NIGO Identifiers which directly linked to Case
            (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        mappedNotes:
          type: array
          description: >-
            List of Notes Identifiers which directly linked to Case (RESERVED
            FOR FUTURE SCOPE)
          items:
            type: string
        mappedDocuments:
          type: array
          description: >-
            List of Exception/NIGO Identifiers which directly linked to Case
            (RESERVED FOR FUTURE SCOPE)
          items:
            type: string
        events:
          type: array
          description: List of events which are applied on the current case
          items:
            $ref: '#/components/schemas/EventInstance'
        parties:
          type: array
          description: >-
            List of individuals/parties associated with the contract/policy
            related to the case
          items:
            type: object
            properties:
              partyRole:
                type: string
                description: Role of the party in the case. (LIST TO BE SHARED BY SOR)
                enum:
                  - Annuitant / Insured, Primary
                  - Owner, Primary
                  - Beneficiary, Primary
                  - Servicing Agent
                  - Agent
              partyType:
                type: string
                description: Type of party involved in the case.
                enum:
                  - Company
                  - Individual
                  - Other
                  - Trust
                  - UGMA
              firstName:
                type: string
                description: First name of the party.
              middleName:
                type: string
                description: Middle name of the party.
              lastName:
                type: string
                description: Last name of the party.
              fullName:
                type: string
                description: Full name of the party.
              prefix:
                type: string
                description: Prefix of the party's name.
              suffix:
                type: string
                description: Suffix of the party's name.
              gender:
                type: string
                description: Gender of the party.
              ssn:
                type: string
                description: ssn of the party.
              percent:
                type: string
                description: Percentage share or involvement of the party in the policy.
        identifiers:
          type: array
          description: List of identifiers received from different systems.
          items:
            $ref: '#/components/schemas/IdentifierInstance'
        additionalData:
          description: Additional data related to the case. (DEPRECATED)
          deprecated: true
          oneOf:
            - $ref: '#/components/schemas/CaseAdditionalDataNB'
            - $ref: '#/components/schemas/CaseAdditionalDataWD'
        stages:
          type: array
          description: >-
            List of stages representing milestone in the journey of a
            case/transaction.
          items:
            $ref: '#/components/schemas/StageInstance'
        createdAt:
          type: string
          format: date-time
          description: >-
            Timestamp when the case instance was created, derived from the time
            of the initial event.
        updatedAt:
          type: string
          format: date-time
          description: >-
            Timestamp when the case instance was last updated, derived from the
            time of the latest event.
        systemUpdatedDt:
          type: string
          format: date
          description: The date when the system was last updated.
        deleted:
          type: boolean
          description: Indicates if the case instance has been deleted.
    TaskDetailById:
      allOf:
        - $ref: '#/components/schemas/TaskListSummary'
      type: object
      properties:
        exceptions:
          type: array
          items:
            type: string
          example: []
        schema:
          type: object
          example:
            schema: http://json-schema.org/draft-04/schema#
            type: object
            properties:
              suitabilityStatus:
                type: string
              notes:
                type: array
                items:
                  type: object
                  properties:
                    submissionDate:
                      type: string
                    commentCategory:
                      type: string
                    commentSubCategory:
                      type: string
                    commentDetail:
                      type: string
                    comment:
                      type: string
                    description:
                      type: string
                    createdDate:
                      type: string
                    createBy:
                      type: string
                    noteId:
                      type: integer
                  required:
                    - submissionDate
                    - commentCategory
                    - commentSubCategory
                    - commentDetail
                    - comment
                    - description
                    - createdDate
                    - createBy
                    - noteId
            required:
              - suitabilityStatus
        data:
          oneOf:
            - $ref: '#/components/schemas/SuitabilityDetails'
            - $ref: '#/components/schemas/AgentInformationDetails'
    DocumentInstance:
      type: object
      properties:
        id:
          type: string
          example: '12345'
        name:
          type: string
          example: Identity_Document.pdf
        documentNumber:
          type: string
          example: '119299808'
        source:
          type: string
          example: onbase
        url:
          type: string
          example: http://dev.onbase.com/document/12345
        updatedAt:
          type: string
          example: 09-April-2023
        fileType:
          type: string
          example: NB Fix
        documentUploadDate:
          type: string
          example: '2024-10-04T18:16:45.000Z'
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        eventRef:
          type: array
          items:
            type: string
            example: 15ea7582-262f-4dfe-8a60-1e8b8e763fd4
    ExceptionInstanceForTask:
      type: object
      properties:
        id:
          type: string
          example: '12324'
        status:
          type: string
          example: New
        category:
          type: string
          example: Agent
        reason:
          type: string
          example: Suitability requested
        detailedReason:
          type: string
          example: Suitability requested from External client
        updatedAt:
          type: string
          example: 09-April-2023
    ExceptionInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique Identifier for Exception Instance
        status:
          type: string
          enum:
            - NEW
            - RESOLVED
          description: Status of Exception Instance
        exceptionRefId:
          type: string
          description: The exceptionRefId of the exception.
          example: NB.EM.068
        category:
          type: string
          description: Category of Exception
        reason:
          type: string
          description: Short description of Exception
        detailedReason:
          type: string
          description: Detailed description of Exception
        updatedAt:
          type: string
          description: Last updated timestamp of Exception
        taskIdList:
          type: array
          items:
            type: string
          uniqueItems: true
          description: List of Task Identifier associated with Exception Instance
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        eventRef:
          type: array
          items:
            type: string
          description: List of Events associated with Exception Instance
    NoteInstance:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier of Note
        note:
          type: string
          description: The Text content of Note
        author:
          type: string
          description: Author of note
        internal:
          type: boolean
          description: Indicates whether the item is internal or not.
        createdAt:
          type: string
          description: The timestamp of Note been created
        updatedAt:
          type: string
          example: 09-April-2023
          description: The timestamp of Note been updated
        desc:
          type: string
          description: Description of note
        additionalData:
          $ref: '#/components/schemas/AdditionalDataInstance'
        eventRef:
          type: array
          items:
            type: string
          description: List of Events associated with Note Instance
    TaskLinkInstance:
      type: object
      properties:
        id:
          type: string
          description: A Unique identifier of Task in Task Management
        taskType:
          type: string
          description: Business friendly type for Task
        label:
          type: string
          description: Business friendly Label for Task
        assignee:
          type: string
          description: User currently assigned to the task
        status:
          type: string
          description: Status of Task (STATUS DISCUSSION IN PROGRESS)
          enum:
            - OPEN
            - CLOSED
            - NEW
            - COMPLETED
            - COMPLETE
        taskName:
          type: string
          description: task name of the task
        queue:
          type: string
          description: Queue to which the task is assigned
        createdAt:
          type: string
          description: Timestamp when the Task was created
        updatedAt:
          type: string
          description: Timestamp when the Task was last updated
        eventRef:
          type: array
          items:
            type: string
            description: List of Events associated with Note Instance
        externalTaskId:
          type: string
          description: >-
            The identifier how an external system understand it for example used
            to map onbase taskId
        notesIdList:
          type: array
          items:
            type: string
          description: List of Note identifiers associated to Task
    AdditionalDataInstance:
      type: object
      additionalProperties:
        type: string
    StageInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the stage instance.
        label:
          type: string
          description: Business Friendly label for the stage instance.
        stageStatus:
          type: string
          description: Current status of the stage instance.
          enum:
            - IN_PROGRESS
            - EXCEPTION
            - COMPLETED
            - NOT_STARTED
        mappedTasks:
          type: array
          description: >-
            List of identifiers for tasks mapped to this stage (RESERVED FOR
            FUTURE SCOPE).
          items:
            type: string
        mappedNotes:
          type: array
          description: >-
            List of identifiers for notes mapped to this stage (RESERVED FOR
            FUTURE SCOPE).
          items:
            type: string
        steps:
          type: array
          description: List of step instances that make up this stage.
          items:
            $ref: '#/components/schemas/StepInstance'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the stage instance was created.
    StepInstance:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the step instance.
        label:
          type: string
          description: Business Friendly label for the step instance.
        stepStatus:
          type: string
          description: Current status of the step instance.
          enum:
            - IN_PROGRESS
            - EXCEPTION
            - COMPLETED
            - NOT_STARTED
        stepResult:
          type: string
          description: Step level decision outcome
        eventRef:
          type: array
          description: List of event references associated with this step.
          items:
            type: string
        mappedTasks:
          type: array
          description: List of identifiers for tasks mapped to this step.
          items:
            type: string
        mappedExceptions:
          type: array
          description: List of exception mapped to this step.
          items:
            type: string
        mappedDocuments:
          type: array
          description: List of document id mapped to this step.
          items:
            type: string
        mappedCases:
          type: array
          description: List of Case id mapped to this step.
          items:
            type: string
        mappedNotes:
          type: array
          description: >-
            List of identifiers for notes mapped to this step (RESERVED FOR
            FUTURE SCOPE).
          items:
            type: string
        multiInstance:
          type: boolean
          description: Indicates whether step is multiple instance or not.

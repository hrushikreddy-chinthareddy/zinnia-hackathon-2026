openapi: 3.0.3
info:
  title: Case Management API
  description: Maintains cases and tasks apis related to the policy lifecycle.
  version: 1.0.0
servers:
  - url: https://dev.api.zinnia.io/
    description: Dev Environment
  - url: https://qa.api.zinnia.io/
    description: QA Environment
  - url: https://uat.api.zinnia.io/
    description: UAT Environment
  - url: https://api.zinnia.io/
    description: PROD Environment
tags:
  - name: Case Instance
    description: Manages cases for all processes
  - name: Task Instance (Legacy)
    description: >-
      Legacy - Manages tasks based on cases. Used for Withdrawal/Renewal. No
      further changes accepted.
  - name: Task Instance (Task Management)
    description: >-
      Manages tasks based on cases. Implemented using Zinnia Live Task
      management framework.
  - name: Task Form Metadata
  - name: Reference data
    description: Reference data applicable for cases
  - name: Exception Instance (Exception Management)
  - name: Exception Reference
paths:
  /case/v1/cases/search:
    post:
      summary: Search cases
      tags:
        - Case Instance
      description: >-
        Retrieve the list of available case instances based on the specified
        criteria.
      operationId: getCaseInstanceList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasePageSearchCriteria'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListInstanceResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
      security:
        - Auth0: []
  /case/v1/cases/stats:
    post:
      summary: Case stats
      tags:
        - Case Instance
      description: >-
        Retrieve the statistics/count of available cases filtered by the
        specified criteria and grouped by the specified attribute.
      operationId: getCaseInstanceStats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseStatsSearchCriteria'
      responses:
        '200':
          description: Case stats retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseStatsSearchResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
      security:
        - Auth0: []
  /case/v1/cases/{caseId}:
    get:
      summary: Get Case Detail
      tags:
        - Case Instance
      description: Retrieve the case instance details using the system identifier (caseId).
      operationId: getCaseInstanceById

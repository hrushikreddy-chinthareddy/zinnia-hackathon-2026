      tags:
        - FGA
      security:
        - Auth0: []
  /fga/v1/tuples/changes:
    get:
      operationId: readChanges
      summary: List all tuples added or removed
      description: List all tuples added or removed
      parameters:
        - name: type
          required: true
          in: query
          description: >-
            resource to check against, checking access for policy would be

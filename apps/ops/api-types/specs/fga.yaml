            default: 10
            example: 10
            type: number
        - name: continuationToken
          required: false
          in: query
          description: continuation token
          schema:
            example: >-
              0yI1FcgqT74npA-o4PoHGtgvfPYa_jCAwkXjRynE-Z9sIaokCAaJMZUtfrGQrr57A3fdV2fYVO11BCkb3zZwPEDnuBotD067A3HdOlbn7F9TluNH
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
      tags:
        - FGA
      security:
        - Auth0: []

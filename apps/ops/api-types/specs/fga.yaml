openapi: 3.0.0
paths:
  /fga/v1/assertions:
    get:
      operationId: readAssertions
      summary: List Assertions
      description: List Assertions
      parameters: []
      responses:
        '200':
          description: List of assertions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAssertionsResponse'
      tags:
        - FGA
    post:
      operationId: writeAssertions
      summary: Create and update Assertions
      description: Create and update Assertions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteAssertionsRequest'
      responses:
        '204':
          description: Assertions updated
      tags:
        - FGA
  /fga/v1/tuples:
    get:
      operationId: readTuples
      summary: Read tuples from OpenFGA
      description: Read tuples from OpenFGA
      parameters:
        - name: user
          required: false
          in: query
          description: >-
            party reference Id prefixed with party, so
            495f40f49d8f415fa59e99716d59f6e9 is
            party:495f40f49d8f415fa59e99716d59f6e9
          schema:
            example: party:495f40f49d8f415fa59e99716d59f6e9
            type: string
        - name: relation
          required: false
          in: query
          description: >-
            the permission to search for on the resource, usually described by
            access + _ + resource example: read_policy
          schema:
            example: read_policy
            type: string
        - name: object
          required: true
          in: query
          description: >-
            specific resource or resource type to search for, prepended with the
            type so policy 1234 is policy:1234 and all policies would be policy:
            with no identifier
          schema:
            example: policy:1234
            type: string
        - name: pageSize
          required: false
          in: query
          description: size of the page
          schema:
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: continuationToken
          required: false
          in: query
          description: continuation token to provide pagination
          schema:
            example: >-
              eyJwayI6IkxBVEVTVF9OU0NPTkZJR19hdXRoMHN0b3JlIiwic2siOiIxem1qbXF3MWZLZExTcUoyN01MdTdqTjh0cWgifQ
            type: string
      responses:
        '200':
          description: List of tuples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadTuplesResponse'
      tags:
        - FGA
      security:
        - Auth0: []
    post:
      operationId: writeTuples
      summary: Write tuples to OpenFGA
      description: Write tuples to OpenFGA
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteTuplesRequest'
      responses:
        '201':
          description: Tuples updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteTuplesResponse'
      tags:
        - FGA
      security:
        - Auth0: []
  /fga/v1/tuples/delete:
    post:
      operationId: deleteTuples
      summary: Delete Tuples
      description: Delete Tuples
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:

info:
  title: FGA Service
  description: Fine Grain Authorization service
  version: 0.1.0
  contact: {}
tags:
  - name: FGA
    description: ''
servers:
  - url: https://api.zinnia.io
components:
  securitySchemes:
    Auth0:
      type: openIdConnect
      openIdConnectUrl: https://login.zinnia.com/.well-known/openid-configuration
      x-kong-security-openid-connect:
        config:
          run_on_preflight: true
          scopes_claim:
            - https://api.zinnia.io/permissions
          audience_claim:
            - aud
          audience_required:
            - https://api.zinnia.io
          auth_methods:
            - bearer
          scopes: []
        enabled: true
        protocols:
          - grpc
          - grpcs
          - http
          - https
  schemas:
    Assertion:
      type: object
      properties:
        user:
          type: string
          description: >-
            party reference Id prefixed with party, so
            495f40f49d8f415fa59e99716d59f6e9 is
            party:495f40f49d8f415fa59e99716d59f6e9
          example: party:495f40f49d8f415fa59e99716d59f6e9
        relation:
          type: string
          description: >-
            the permission or relation for the resource, usually described by
            access + _ + resource example: read_policy
          example: read_policy
        object:
          type: string
          description: >-
            specific resource, prepended with the type so policy 1234 is
            policy:1234
          example: policy:1234
        expectation:
          type: boolean
          description: expectation of assertion, true or false
          example: true
      required:
        - user
        - relation
        - object
        - expectation
    ReadAssertionsResponse:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/Assertion'
      required:
        - assertions
    WriteAssertionsRequest:
      type: object
      properties:
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/Assertion'
      required:
        - assertions
    FGATupleResponse:
      type: object
      properties:
        key:
          type: object
        timestamp:
          type: string
          format: date-time
    ReadTuplesResponse:
      type: object
      properties:
        tuples:
          type: array
          items:
            $ref: '#/components/schemas/FGATupleResponse'
        continuation_token:
          type: string
        continuationToken:
          type: string
    Tuple:
      type: object
      properties:
        user:
          type: string
          description: >-
            party reference Id prefixed with party, so
            495f40f49d8f415fa59e99716d59f6e9 is
            party:495f40f49d8f415fa59e99716d59f6e9
          example: party:495f40f49d8f415fa59e99716d59f6e9
        relation:
          type: string
          description: >-
            the permission or relation for the resource, usually described by
            access + _ + resource example: read_policy
          example: read_policy
        object:
          type: string
          description: >-
            specific resource, prepended with the type so policy 1234 is
            policy:1234
          example: policy:1234
      required:
        - user
        - relation
        - object
    WriteTuplesRequest:
      type: object
      properties:
        tuples:
          type: array
          items:
            $ref: '#/components/schemas/Tuple'
        disableTransaction:
          type: boolean
      required:
        - tuples
    WriteTuplesResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/Tuple'
    DeleteTuplesRequest:
      type: object
      properties:
        tuples:
          type: array
          items:
            $ref: '#/components/schemas/Tuple'
      required:
        - tuples
    DeleteTuplesResponse:
      type: object
      properties:
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Tuple'
    Changes:
      type: object
      properties:
        user:
          type: string
          description: >-
            party reference Id prefixed with party, so
            495f40f49d8f415fa59e99716d59f6e9 is
            party:495f40f49d8f415fa59e99716d59f6e9
          example: party:495f40f49d8f415fa59e99716d59f6e9
        relation:
          type: string
          description: >-
            the permission or relation for the resource, usually described by
            access + _ + resource example: read_policy
          example: read_policy
        object:
          type: string
          description: >-
            specific resource, prepended with the type so policy 1234 is
            policy:1234
          example: policy:1234
        operation:
          type: string
          description: specific operation performed
          example: TUPLE_OPERATION_WRITE
        timestamp:
          format: date-time
          type: string
          description: timestamp it occured
          example: '2023-12-06T18:36:35.846Z'
      required:
        - user
        - relation
        - object
        - operation
        - timestamp
    ChangesResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Changes'
      required:
        - changes
    CheckRequest:
      type: object
      properties:
        user:
          type: string
          description: >-
            party reference Id prefixed with party, so
            495f40f49d8f415fa59e99716d59f6e9 is
            party:495f40f49d8f415fa59e99716d59f6e9
          example: party:495f40f49d8f415fa59e99716d59f6e9
        relation:
          type: string
          description: >-
            the permission to check on the resource, usually described by access
            + _ + resource example: read_policy
          example: read_policy
        object:
          type: string
          description: >-
            specific resource to check against, prepended with the type so
            policy 1234 is policy:1234
          example: policy:1234
      required:
        - user
        - relation
        - object
    BulkCheckRequest:
      type: object
      properties:
        tuples:
          type: array
          items:
            $ref: '#/components/schemas/CheckRequest'
      required:
        - tuples
    CheckTupleResponse:
      type: object
      properties:

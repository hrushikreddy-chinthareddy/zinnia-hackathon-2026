  /fga/v1/search-parties:
    get:
      operationId: SearchPartyController_getPartyRelatedData
      summary: Search for related cases and policies for a party
      description: >-
        Searches and retrieves all related cases and/or policies for a given
        party ID
      parameters:
        - name: partyId
          required: true
          in: query
          description: ID of the party to get related data for
          schema:
            type: string
        - name: filterType
          required: false
          in: query
          description: Filter to show only policies or cases related data
          schema:
            enum:
              - policies
              - cases
            type: string
        - name: maxDepth
          required: false
          in: query
          description: >-
            Maximum depth for recursive relationship fetching. Leave empty for
            unlimited depth.
          schema:
            type: number
        - name: excludeSource
          required: false
          in: query
          description: Exclude either entity or salesentity data sources from the results
          schema:
            enum:
              - entity
              - salesentity
            type: string
        - name: directOnly
          required: false
          in: query
          description: >-
            Return only direct party relationships. For policies: return direct
            party policies only. For cases: return direct party cases plus cases
            from direct party policies.
          schema:
            type: boolean
      responses:
        '200':
          description: Successfully retrieved related data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyRelatedDataResponse'
        '404':
          description: Party not found
      tags:
        - FGA

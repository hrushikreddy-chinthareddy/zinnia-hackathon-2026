openapi: 3.0.1
info:
  title: Documents
  version: snapshot
servers:
  - url: https://dev.api.zinnia.io
    description: Dev Environment
  - url: https://qa.api.zinnia.io
    description: QA Environment
  - url: https://uat.api.zinnia.io
    description: UAT Environment
  - url: https://api.zinnia.io
    description: PROD Environment
paths:
  '/document/v3/documents/{documentId}':
    put:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: updates document on the basis of provided id
      description: updates document on the basis of provided id
      operationId: updateDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '204':
          description: document updated successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '400':
          description: document update failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
  '/document/v3/documents/bulk':
    put:
      tags:
        - document-controller
      summary: update documents in bulk
      description: update multiple documents in bulk
      operationId: updateDocumentsInBulk
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Metadata'
        required: true
      responses:
        '200':
          description: documents updated successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
        '400':
          description: documents update failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
  '/document/v3/documents':
    post:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: uploads files in AWS S3 and stores metadata in db
      description: uploads document and return document ID from db
      operationId: uploadDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - metadata
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: document stored successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          description: document storage failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
    delete:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: Deletes documents based on the provided IDs
      description: Deletes multiple documents based on the provided list of IDs
      operationId: deleteDocuments
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              type: array
              items:
                type: string
              example:
                - '6753587970cba5484a244cd2'
                - '6753587970cba5484a244cd3'
                - '6753587970cba5484a244cd4'
              description: List of document IDs to be deleted
        required: true
      responses:
        '204':
          description: Documents deleted successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '400':
          description: Document deletion failed for one or more documents
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
        '401':
          description: Unauthorized access
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataOperationsResponse'
  '/document/v3/documents/search':
    post:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: searches document on the basis of provided input request
      description: searches document on the basis of provided input request
      operationId: searchDocuments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: documents retrieved successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
        '400':
          description: documents retrieval failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SearchDocumentResponse'
  '/document/v3/documents/{documentId}/url':
    get:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: retrieves the pre-signed url for a document by id
      description: retrieves the pre-signed url for a document by id
      operationId: getDocumentUrl
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: pre-signed url retrieved successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentUrlFetchResponse'
        '400':
          description: failed to fetch pre-signed URL
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentUrlFetchResponse'
  '/document/v3/documents/{documentId}/metadata':
    get:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: fetches all metadata by document id
      description: fetches all metadata by document id
      operationId: getMetadataByDocumentId
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: isAllVersionsNeeded
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: documentType
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: document metadata retrieved successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
        '400':
          description: document metadata retrieval failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/MetadataByIdResponse'
  '/document/v3/documents/{documentId}/download':
    get:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: fetches and downloads any document by id
      description: fetches and downloads any document by id
      operationId: downloadDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: document downloaded successfully
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentDownloadResponse'
        '400':
          description: document download failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DocumentDownloadResponse'
  '/document/v3/documents/taxForms/{formId}':
    get:
      security:
        - Auth0: []
      tags:
        - document-controller
      operationId: downloadTaxForm
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
        - name: clientCode
          in: query
          required: true
          schema:
            type: string
        - name: alias
          in: query
          required: false
          schema:
            type: string
        - name: fChar
          in: query
          required: true
          schema:
            type: string
        - name: ssn
          in: query
          required: true
          schema:
            type: string
        - name: contractNumber
          in: query
          required: true
          schema:
            type: string
        - name: taxYear
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: taxFormType
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: cutoffMonth
          in: query
          required: false
          schema:
            maximum: 12
            minimum: 0
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/TaxformDownloadResponse'
  '/document/v3/documents/taxForms':
    get:
      security:
        - Auth0: []
      tags:
        - document-controller
      summary: fetches taxForms from SOVOS
      operationId: getTaxForms
      parameters:
        - name: clientCode
          in: query
          required: true
          schema:
            type: string
        - name: contractNumber
          in: query
          required: true
          schema:
            type: string
        - name: taxYear
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: alias
          in: query
          required: false
          schema:
            type: string
        - name: cutoffMonth
          in: query
          required: false
          schema:
            maximum: 12
            minimum: 0
            type: integer
            format: int32
            default: 1
        - name: ssn
          in: query
          required: false
          schema:
            type: string
        - name: numYears
          in: query
          required: false
          schema:
            maximum: 5
            minimum: 1
            type: integer
            format: int32
            default: 1
        - name: roles
          in: query
          required: false
          schema:
            type: string
        - name: sourceSystem
          in: query
          required: false
          schema:
            type: string
        - name: taxFormType
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/TaxformResponseList'
components:
  schemas:
    Metadata:
      type: object
      properties:
        documentId:
          type: string
          description: Unique ID in mongo db
          example: 670e23dfab593b4387210b81
        docClassification:
          type: string
          description: Document classification to identify document type
          example: INBOUND
          enum:
            - INBOUND
            - OUTBOUND
            - SERVICE_REQUEST_FORM
        parentCarrierCode:
          type: string
          description: Parent Company code
          example: NASU
        source:
          type: string
          description: Source of the document
          example: Email
        formNumber:
          type: string
          description: Form number
          example: '123456'
        fileType:
          type: string
          description: File type
          example: PDF
        docCategory:
          type: string
          description: Document category
          example: NEW_BUSINESS
          enum:
            - NEW_BUSINESS
            - POST_ISSUE
            - DEATH
            - CORRESPONDENCE
            - TAX_FORMS
        childCarrierCode:
          type: string
          description: Child company code
          example: DLNY
        formVersion:
          type: string
          description: Form version
          example: V1
        documentType:
          type: string
          description: Document type
          example: NB Application
        documentDate:
          type: string
          description: Date of the document
          format: date-time
        documentTypeDescription:
          type: string
          description: Description of the document type
          example: Deferred Annuity Application
        zinniaLiveCaseId:
          type: string
          description: Zinnia Live Case ID
          example: ZLC09876
        planCode:
          type: string
          description: Plan code
          example: '565'
        productName:
          type: string
          description: Product name
          example: Annuity Policy
        policyNumber:
          type: string
          description: Policy number
          example: '23109168'
        productCategory:
          type: string
          description: Product category
          example: Insurance
        brokerMasterNumber:
          type: string
          description: Broker master number
          example: BKR123456
        repMasterNumber:
          type: string
          description: Rep master number
          example: REP987654
        agentExternalID:
          type: string
          description: Agent external ID
          example: AGENT123
        brokerExternalID:
          type: string
          description: Broker external ID
          example: BROKER456
        brokerName:
          type: string
          description: Broker name
          example: ABC Brokerage
        agentFirstName:
          type: string
          description: Agent first name
          example: John
        agentLastName:
          type: string
          description: Agent last name
          example: Doe
        agentEmailAddress:
          type: string
          description: Agent email address
          example: agent@example.com
        agentTaxId:
          type: string
          description: Agent tax ID
          example: '987654321'
        mailTrackingNumber:
          type: string
          description: Mail tracking number
          example: '4453166346'
        deliveryMethod:
          type: string
          description: Delivery method
          example: EMAIL
          enum:
            - PRINT
            - EMAIL
        ownerFirstName:
          type: string
          description: Owner first name
          example: Jane
        ownerMiddleName:
          type: string
          description: Owner middle name
          example: A.
        ownerLastName:
          type: string
          description: Owner last name
          example: Smith
        ownerSSN:
          type: string
          description: Owner SSN or tax ID
          example: 123-45-6789
        emailFrom:
          type: string
          description: Email 'from' address
          example: sender@example.com
        emailTo:
          type: string
          description: Email 'to' address
          example: recipient@example.com
        emailSubject:
          type: string
          description: Email subject
          example: New Business Application
        emailDateTime:
          type: string
          description: Date and time of the email
          format: date-time
          example: '2023-01-01T10:30:00Z'
        startPage:
          type: string
          description: Start page of the document
          example: '1'
        pageCount:
          type: integer
          description: Total page count
          format: int64
          example: 5
        appId:
          type: string
          description: Application ID
          example: EDJ041120240000000001
        mailShipDate:
          type: string
          description: Mail ship date
          format: date-time
        sourceSystem:
          type: string
          description: Source system
          example: Indexation
        docAccessLevel:
          type: string
          description: Access level of the document
          example: CLIENT_COPY
          enum:
            - CLIENT_COPY
            - AGENT_COPY
        originalTextIndex:
          type: string
          description: Original text index
          example: Index001
        participantAccountNumber:
          type: string
          description: Participant account number
          example: ACC12345
        sourceFileName:
          type: string
          description: Source file name
          example: Q100720JHLILFGRC1LETTER.pdf\\01010001 GENLTR Document_395069591.pdf
        roles:
          type: string
          description: Roles associated with the document
          example: Admin, User
        sedDocumentSchemaType:
          type: string
          description: SED document schema type
          example: SchemaType1
        stockNumber:
          type: string
          description: Stock number
          example: STK5678
        distributionChannel:
          type: string
          description: Distribution channel
          example: Online
        displayName:
          type: string
          description: Display name of the document
          example: New Business Policy Document
        documentNumber:
          type: string
          description: Document number
          example: DOC9876
        customFields:
          type: object
          additionalProperties:
            type: string
            description: Custom fields as a key-value map
            example: '{"customField1":"value1"}'
        sourceDocId:
          type: string
          description: Source document ID
          example: SRC123456
        docPopUrl:
          type: string
          description: Document URL
          example: https://docpop.example.com/documents/2448728
        periodYear:
          type: integer
          description: Document period year
          format: int32
          example: 2024
        periodQuarter:
          type: string
          description: Document period quarter
          example: Q2
    MetadataOperationsResponse:
      type: object
      properties:
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Response message
          example: Document updated/deleted successfully
        success:
          type: boolean
    BulkUpdateResponse:
      type: object
      properties:
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: '123e4567-e89b-12d3-a456-426614174000'
        successfulDocumentIds:
          type: array
          description: List of successfully updated document IDs
          items:
            type: string
            description: List of successfully updated document IDs
            example: '67124697f3bef2497b6accfb,67724697f3bef2497b6accfb'
        failedUpdates:
          type: array
          items:
            $ref: '#/components/schemas/ErrorUpdateResponse'
    ErrorUpdateResponse:
      type: object
      properties:
        documentId:
          type: string
          description: Unique document ID in mongo db
          example: 67124697f3bef2497b6accfb
        message:
          type: string
          description: Response message
          example: Document ID cannot be empty!
    DocumentUploadResponse:
      type: object
      properties:
        documentId:
          type: string
          description: Unique ID in mongo db
          example: 670e23dfab593b4387210b81
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Response message
          example: Document uploaded successfully
        success:
          type: boolean
    SearchRequest:
      type: object
      properties:
        parentCarrierCode:
          type: string
          description: List of client codes associated with the document search
          example: NASU
        documentClassification:
          type: string
          description:
            Classification of the document indicating type, e.g., inbound or
            outbound
          example: INBOUND
          enum:
            - INBOUND
            - OUTBOUND
            - SERVICE_REQUEST_FORM
            - TAX_FORMS
        documentType:
          type: string
          description: Type of document, defining its primary purpose
          example: NB Application
        documentCategory:
          type: string
          description: Category of the document, such as New Business or Claim
          example: NEW_BUSINESS
          enum:
            - NEW_BUSINESS
            - POST_ISSUE
            - DEATH
            - CORRESPONDENCE
            - TAX_FORMS
        policyNumber:
          type: string
          description: Policy number associated with the document, used for identification
          example: '23109168'
        planCode:
          type: string
          description: Plan code associated with the document, used for identification
          example: plan67890f
        documentDate:
          type: string
          description: Date when the document was created or issued
          format: date
          example: 2024-10-23
        documentStartDate:
          type: string
          description: Start date of the document period for filtering results
          format: date
          example: 2024-10-01
        documentEndDate:
          type: string
          description: End date of the document period for filtering results
          format: date
          example: 2024-10-31
        documentStatus:
          type: array
          description:
            List of statuses the document may have, supporting filtering by
            multiple statuses
          items:
            type: string
            description:
              List of statuses the document may have, supporting filtering by
              multiple statuses
            example: 'ACTIVE'
            enum:
              - ACTIVE
              - INACTIVE
        periodYear:
          type: integer
          description: The year part of the period associated with the document
          format: int32
          example: 2024
        periodQuarter:
          type: string
          description:
            Quarter of the year associated with the document's period, in Q1-Q4
            format
          example: Q2
        ownerSSN:
          type: string
          description:
            Social Security Number of the document's owner, partially masked
            for security
          example: 123-45-6789
        appId:
          type: string
          description: Application ID tied to the document for tracking and retrieval
          example: XXXXEDJ041120240000000001
        zinniaLiveCaseId:
          type: string
          description: Unique case ID in the Zinnia system associated with the document
          example: ZLC09876
        agentTaxId:
          type: string
          description: Tax ID associated with the agent handling the document
          example: TAX987654
        orderBy:
          type: string
          description: The field used to order search results; default is document category
          example: documentCategory
        orderByDirection:
          type: string
          description:
            Direction of the sort order for search results, either ascending or
            descending
          example: ASC
          enum:
            - ASC
            - DESC
    MetadataSearchResponse:
      type: object
      properties:
        documentClassification:
          type: string
          description: Document classification to identify document type
          example: Inbound
        source:
          type: string
          description: Source of the document
          example: Email
        planCode:
          type: string
          description: Plan code associated with the document
          example: '565'
        documentStatus:
          type: integer
          description: Current status of the document
          format: int32
        documentId:
          type: string
          description: Unique ID of the document in MongoDB
          example: 67124697f3bef2497b6accfb
        documentDate:
          type: string
          description: Date associated with the document
          format: date-time
        documentType:
          type: string
          description: Type of the document
          example: NB Application
        documentCategory:
          type: string
          description: Category of the document
          example: New Business
        documentTypeDescription:
          type: string
          description: Detailed description of the document type
          example: Deferred Annuity Application
        zinniaLiveCaseId:
          type: string
          description: Zinnia live case ID associated with the document
          example: ZLC09876
        appId:
          type: string
          description: Application ID related to the document
          example: XXXXEDJ041120240000000001
        mailTrackingNumber:
          type: string
          description: Tracking ID for the document
          example: '4453166346'
        parentCarrierCode:
          type: string
          description: Client code associated with the document
          example: NASU
        policyNumber:
          type: string
          description: Policy number linked to the document
          example: '23109168'
        createDate:
          type: string
          description: Creation date of the document
          format: date-time
        correlationId:
          type: string
          description: Correlation ID for the document
          example: 12345-corr-67890
        docPopUrl:
          type: string
          description: Document's URL in the Document Pop system
          example: https://docpop.example.com/documents/2448728
        periodYear:
          type: integer
          description: Year related to the document period
          format: int32
          example: 2024
        periodQuarter:
          type: string
          description: Quarter related to the document period
          example: Q2
        fileType:
          type: string
          description: File type of the document
          example: pdf
        displayName:
          type: string
          description: Display name for the document
          example: New Business Policy Document
        brokerMasterNumber:
          type: string
          description: Master number of the broker associated with the document
          example: BKR123456
        repMasterNumber:
          type: string
          description: Master number of the representative associated with the document
          example: REP987654
    SearchDocumentResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of documents found
          format: int32
          example: 10
        documents:
          type: array
          items:
            $ref: '#/components/schemas/MetadataSearchResponse'
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: '123e4567-e89b-12d3-a456-426614174000'
        message:
          type: string
          description: Response message
          example: Documents retrieved successfully
        success:
          type: boolean
    DocumentUrlFetchResponse:
      type: object
      properties:
        preSignedUrl:
          type: string
          description: Pre-signed URL for document
          example: https://s3.amazonaws.com/zinnia-documents/123e4567-e89b-12d3-a456-426614174000
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Response message
          example: Document fetched successfully
        success:
          type: boolean
    MetadataByIdResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetadataResponse'
        correlationId:
          type: string
          description: Unique ID for correlating requests
          example: 123e4567-e89b-12d3-a456-426614174000
        message:
          type: string
          description: Response message
          example: Document retrieved successfully
        success:
          type: boolean

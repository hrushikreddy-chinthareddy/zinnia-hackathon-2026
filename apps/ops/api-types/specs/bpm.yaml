    TransactionAmounts:
      allOf:
        - $ref: "#/components/schemas/AdhocTransactionAmount"
        - type: object
          properties:
            requestedAmount:
              type: number
              format: double
              description: The initial premium amount (deposit amount) paid by the party.
              example: 100
            amountType:
              $ref: "#/components/schemas/AmountType"
            disbursementType:
              $ref: "#/components/schemas/DisbursementType"
            disbursementPaymentForm:
              $ref: "#/components/schemas/DisbursementPaymentForm"
            loanType:
              $ref: "#/components/schemas/LoanType"
            loanInterestType:
              $ref: "#/components/schemas/loanInterestType"
            paymentAmount:
              type: number
              format: double
              description: >-
                The initial premium amount (deposit amount) drafted to proceed
                with the payment
              example: 100
            appliedAmount:
              type: number
              format: double
              description: >-
                The initial premium amount that is actually applied to the
                policy.
              example: 100
            calculatedAmount:
              type: number
              format: double
              description: >-
                The amount calculated by the LPS if the issuance transaction
                outcome fails
              example: 100
            totalChargeAmount:
              type: number
              format: double
              description: Sum of Transaction Level charges
              example: 100
            taxableAmount:
              type: number
              format: double
              description: >-
                Taxable amount for Transaction. Even If Payee selects Not To
                Withhold, this will be populated if there was Gain distributed.
              example: 100
            deathClaimPayoutPreSupplementalSecurityIncome:
              type: number
              format: double
              description: Death claim payout amount
              example: 1000
            claimStatutoryInterestAmount:
              type: number
              format: double
              description: Any interest generated on the claim amount
              example: 1000
            deathBenefitInterestCalculatedFromDate:
              type: number
              format: double
              description: Product team to review
              example: 1000
            claimStatutoryInterestRate:
              type: number
              format: double
              description: Product team to review
              example: 1000

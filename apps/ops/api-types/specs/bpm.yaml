      type: object
      allOf:
        - $ref: "#/components/schemas/NewLoan"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    FullSurrenderRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/FullSurrender"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: >-
            BPM will have to override the rules if this variable is marked as
            true
    PartialWithdrawalOneTimeRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/PartialWithdrawalOneTime"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: >-
            BPM will have to override the rules if this variable is marked as
            true
    OneTimePremiumRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/OneTimePremiumTransaction"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        override:
          type: boolean
          description: >-
            BPM will have to override the rules if this variable is marked as
            'true'
    SystematicProgramUpdateRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/SystematicProgramUpdate"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
    AddressChangeRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/AddressChange"
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        deleteRequest:
          type: boolean
          description: >-
            Flag for delete or update request. If flag==true then Delete Request
            else Update Request
          default: false
    AdhocDisbursementParty:
      type: object
      properties:
        partyRole:
          $ref: "#/components/schemas/PartyRole"
        partyId:
          type: string
          description: Pending Review by Product Team
          example: Party_PI_1
        paymentForm:
          $ref: "#/components/schemas/PaymentForm"
        allocationPercentage:
          type: number
          format: double
          description: >-
            At Policy Level for Each Applicable Fund (Everly there is only one
            Fixed) Therefore this be 100%
          example: 100
        bankId:
          type: string
          example: Bank_1
          description: Comes in Acord 103
        addressId:
          type: string
          example: "1"
          description: Address Id
        forBenefitOfOrForFurtherCredit:
          type: string
          example: TBD
          description: >-
            FBO - For Benefit Of, FFC - For Further Credit. To notate a second
            beneficiary or to designate a person or organization when funds are
            disbursed out.
    SetDeliveryDateEligibilityRequest:
      type: object
      properties:
        correlationId:
          type: string
          example: 864e43a0-2c2f-4a11-9d7f-69ed40115066
        taxId:
          type: string
          example: "666911019"
        documentType:
          type: string
          example: POLPG
    SetDeliveryDateRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/SetDeliveryDateEligibilityRequest"
      properties:
        acknowledgementDate:
          type: string
          format: date-time
        reverseInitiator:
          type: boolean
          description: >-
            Property to isolate source transaction(s) that initiated the
            reversal
    EDeliveryEnrollmentRequest:
      type: object
      properties:
        id:
          type: string
          description: preferenceId  (should be null for preference creation)
          example: e22cd4aee27d34c9b7c748d50e558b41
        carrierId:
          type: string
          description: carrier id for policy
          example: CARRIERID_1
        deliveryOption:
          type: string
          enum:
            - EMAIL
            - FAX
            - MAIL
          description: Delivery Options - Applicable values EMAIL/FAX/MAIL
          example: EMAIL
        email:
          type: string
          example: abc.def@gmail.com
          description: User's email
        effectiveFrom:
          type: string
          format: date-time
          description: >-
            Date (with pattern "yyyy-MM-dd'T'HH:mm:ss'Z'") when the preference
            will be effective, default value is '2999-12-31T00:00:00.000Z'
        effectiveTo:
          type: string
          format: date-time
          description: >-
            Date (with pattern "yyyy-MM-dd'T'HH:mm:ss'Z'") when the preference
            will stop being effective
        documentType:
          type: string
          enum:
            - NWB
            - ANST
            - CONF
            - TAX
            - AGNT
            - POLPG
          description: Type of document
          example: AGNT
        partyId:
          type: string
          description: Unique reference id of the party
          example: f22de4bff27e45d9a7c859e61f668c50
        acknowledgedByPartyId:
          type: string
          description: >-
            Party that initiated the acknowledgment (i.e. an agent, if not the
            party referred to by partyId)
          example: f22de4bff27e45d9a7c859e61f668c50
      required:
        - carrierId
        - deliveryOption
        - effectiveFrom
        - documentType
        - partyId
        - acknowledgedByPartyId
    InitialPremiumRequest:
      type: object
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        correlationId:
          type: string
          example: 864e43a0-2c2f-4a11-9d7f-69ed40115066
          description: The unique ID to track transaction request across all systems
        effectiveDate:
          type: string
          format: date
          example: "2023-01-01T00:00:00.000Z"
          description: >-
            Date when the transaction was originally scheduled or expected to
            happen. It can be a non-business day
        reverseInitiator:
          type: boolean
          default: false
          description: >-
            Property to isolate source transaction(s) that initiated the
            reversal
        transactionReason:
          type: string
          description: Optional Reason for this transaction
        transactionAmounts:
          $ref: "#/components/schemas/TransactionAmounts"
        fundAllocation:
          $ref: "#/components/schemas/FundAllocation"
        exchange:
          $ref: "#/components/schemas/TransactionExchange"
        taxBasis:
          $ref: "#/components/schemas/TransactionTaxBasis"
        payor:
          type: object
          properties:
            partyId:
              type: string
              example: Party_PI_1
              description: Impacted Party in the event of financial transaction
            paymentForm:
              $ref: "#/components/schemas/PaymentForm"
            bankId:
              type: string
              example: Bank_1
              description: Comes in Acord 103
            partyRole:
              type: string
              description: Party Role
    FundAllocationChangeRequest:
      type: object
      properties:
        caseId:
          type: string
          example: CaseAU0000002202312181421
          description: Zinnia Live Case ID
        correlationid:
          type: string
          example: 657b717b7dcf554abf9ef067
        effectiveDate:
          type: string
          format: date
          example: "2023-01-01T00:00:00.000Z"
          description: >-
            Date when the transaction was originally scheduled or expected to
            happen. It can be a non-business day
        reverseInitiator:
          type: boolean
          description: >-
            Property to isolate source transaction(s) that initiated the
            reversal
        allocation:
          $ref: "#/components/schemas/FundAllocation"
    InvestmentType:
      type: string
      enum:
        - INVESTMENTFUND
        - INVESTMENTMODEL
      description: TBD
    TransactionExchange:
      type: object
      properties:
        policyNumber:
          type: string
          description: Unique number given to an exchange/transfer.
          example: EX0000001
        exchangeDescription:
          $ref: "#/components/schemas/ExchangeDescription"
        exchangeDate:
          type: string
          format: date
          description: The date on which 1035 Exchange occurs
          example: "2023-01-01T00:00:00.000Z"
        lineOfBusiness:
          $ref: "#/components/schemas/LineOfBusiness"
        exchangeAmount:
          type: number
          format: double
          description: Total Dollar received in 1035 Exchange
          example: 161.81698
        qualificationType:
          $ref: "#/components/schemas/QualificationType"
        costBasis:
          type: number
          format: double
          description: Original cost basis of the policy being exchanged - previous Policy
          example: 161.81698
        modifiedEndowmentContractStatus:
          type: boolean
          enum:
            - true
            - false
          description: >-
            Indicates if the original policy being exchanged is classified as
            modifiedEndowment contract status
        outstandingLoanRolloverAmount:
          type: number
          format: double
          description: >-
            The amount of any outstanding loan against the original policy that
            will be rolled over into the new policy during the 1035 exchange
          example: 161.81698
    TransactionTaxBasis:
      type: object
      properties:
        currentContributionAmount:
          type: number
          format: double
          description: >-
            Only for Qualified IRA - normally entered by Ops. It has to do with
            contribution year.  People can submit IRA payment for the 2024 tax
            year up until April 15, 2025 If they were to send in, say $10,000,
            in March and say that $5,000 was 2024 and $5,000 is 2025, we'd load
            $5,000 as a current year contribution and $5,000 as a prior year
            contribution
          example: 161.81698
        currentTaxYear:
          type: number
          format: int32
          description: The tax year for which the current contribution is being reported.
          example: 1
        priorContributionAmount:
          type: number
          format: double
          description: Only for Qualified IRA - normally entered by Ops
          example: 161.81698
        priorTaxYear:
          type: number
          format: int32
          description: Current Tax Year - Default to
          example: 1
        preTaxEquityAndFiscalResponsibilityActBasis:
          type: number
          format: double
          description: >-
            Cost basis established before August 14, 1982. This type of cost
            basis will be withdrawn from an annuity before any gain (taxable
            amount) is withdrawn
          example: 161.81698
        postTaxEquityAndFiscalResponsibilityActBasis:
          type: number
          format: double
          description: >-
            Cost basis established on or after August 14, 1982. This type of
            cost basis is not withdrawn from an annuity until all gain has been
            withdrawn
          example: 161.81698
        postTechnicalAndMiscellaneousRevenueActAmount:
          type: number
          format: double
          description: Applies to 403b Qual type
          example: 161.81698
    FundAllocation:
      type: object
      properties:
        investmentType:
          $ref: "#/components/schemas/InvestmentType"
        modelId:
          type: string
          description: The corresponding Model Id of the elected model

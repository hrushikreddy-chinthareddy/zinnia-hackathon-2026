      type: object
      properties:
        requestedAmount:
          type: number
          format: double
          description: The initial premium amount (deposit amount) paid by the party.
          example: 100
        amountType:
          $ref: "#/components/schemas/AmountType"
        disbursementType:
          $ref: "#/components/schemas/DisbursementType"
        disbursementPaymentForm:
          $ref: "#/components/schemas/DisbursementPaymentForm"
        loanType:
          $ref: "#/components/schemas/LoanType"
        loanInterestType:
          type: string
          enum:
            - FIXED
            - INDEXED
            - VARIABLE
            - ADJUSTABLE
          description: >-
            Loan Interest Type - Selected by user from dropdown values, default
            to Fixed
    AdhocParty:
      allOf:
        - $ref: "#/components/schemas/BaseAdhocParty"
        - type: object
          properties:
            paymentForm:
              $ref: "#/components/schemas/PaymentForm"
    AmountType:
      type: string
      enum:
        - AMOUNT
        - PERCENTAGE
        - MAX
        - FREEWITHDRAWALAMOUNT
        - WITHDRAWALUNTILBASIS
        - EARNINGSONLY
        - PRORATA
      description: >-
        Amount Type selected by user. Following is dropdown list 1. Amount -- If
        selected user should be able to enter Amount for Transaction Amount
        field 2. Percent -- If selected user should be able to enter Percentage
        for Transaction Amount field 3. Max -- If selected user should NOT be
        able to enter Amount. Auto calculated using Maximum Withdrawal Amount.
        4. Free Withdrawal Amount -- If selected user should NOT be able to
        enter Amount. Auto calcualted using Free Withdrawal Amount. 5. Withdraw
        Until Basis ---- If selected user should NOT be able to enter Amount.
        Auto calcualted using Cost Basis.
    LoanType:
      type: string
      enum:
        - PREFERRED
        - NONPREFERREDSTANDARDLOAN
        - INDEXLOAN
      description: >-
        Loan Types - Selected by user from dropdown values, default to
        Non-Preferred Standard Loan

        "400":
          description: OneTime Premium Failure Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
              examples:
                failure:
                  $ref: "#/components/examples/failureTransactionResponse"
        "500":
          description: Unexpected error occured, please check server logs
      security:
        - Auth0: []
  /bpm/v1/policies/{planCode}/{policyNumber}/systematicprograms/{arrangementId}/validation:
    post:
      tags:
        - Financial Transactions
      summary: Validate Systematic Program Update Transaction

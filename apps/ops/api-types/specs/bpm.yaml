          type: string
          enum:
            - EMAIL
            - MAIL
            - PHONE
            - FAX
            - TEXT
            - NONE
            - OTHER
          description: The preference of communication such as phone, email or mail
        text:
          type: string
          example: in-person or video call id https://company.us/j/1234567890
          description: If type OTHER, then provide further info using text.
